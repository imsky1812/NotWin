  Fingerprint  : one continuous shot · 8 beats · taskbar→dots / dock / launcher / quick panel / notch dashboard / widgets + draw / setup / wordmark · stock taskbar dissolves into the dock · everything collapses into a dot-matrix "NotWin"
  Palette      : #000/#070707 base (Brush.Ink), #1A1A1A cards, #E8E8E8 text, #E7E7E7 light wallpaper, red #D71921 accent (Tokens.xaml)
  Fonts        : Space Grotesk 500 + Space Mono (bundled, OFL)
  Background   : halftone dot field, breathing (techniques §7c #8), dark → light (dot swell) → dark

   ===================================================================================== */
const DPR=1; const bg=$('#bg'), fx=$('#fx'); [bg,fx].forEach(c=>{c.width=VW*DPR;c.height=VH*DPR;c.style.width=VW+'px';c.style.height=VH+'px';});
const bctx=bg.getContext('2d'), fctx=fx.getContext('2d');
const BG={m:0,A:0,B:1e5,cx:960,cy:540,q:1};
const PITCH=14.5;
function density(x,y,t){const nx=(x-960)/960,ny=(y-540)/540;const e=Math.sqrt(nx*nx*.85+ny*ny*1.3);
  const n=Math.sin(x*.0105+Math.sin(y*.0063+t*.21)*1.6+t*.12)*Math.cos(y*.0122-t*.17+Math.sin(x*.0041)*1.4);
  return clamp((e-.64)*1.8+n*.3+.04*Math.sin(t*1.3+x*.003),0,1);}
function drawBG(t,s,tx,ty){
  const light=BG.m>.5; const base=light?'#E7E7E7':'#070707', dotc=light?'#1a1a1a':'#BDBDBD';
  bctx.setTransform(DPR,0,0,DPR,0,0); bctx.fillStyle=base; bctx.fillRect(0,0,VW,VH);
  const x0=Math.floor((-tx/s)/PITCH)-1, x1=Math.ceil(((VW-tx)/s)/PITCH)+1;
  const y0=Math.floor((-ty/s)/PITCH)-1, y1=Math.ceil(((VH-ty)/s)/PITCH)+1;
  const full=PITCH*.8; bctx.fillStyle=dotc; bctx.beginPath();
  for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++){const x=i*PITCH+PITCH/2,y=j*PITCH+PITCH/2;let r=density(x,y,t)*4.8*BG.q;
    if(BG.A>0||BG.B<1e4){const d=Math.hypot(x-BG.cx,y-BG.cy);
      if(BG.A>0)r=mix(r,full,clamp((BG.A-d)/240,0,1)); else r=r*clamp((BG.B-d)/240,0,1);}
    if(r<.55)continue; const X=x*s+tx,Y=y*s+ty,R=r*s; bctx.moveTo(X+R,Y); bctx.arc(X,Y,R,0,6.2832);}
  bctx.fill();
  /* the wallpaper's single red dot */
  bctx.fillStyle='#D71921';bctx.beginPath();bctx.arc(157*s+tx,667*s+ty,7.5*s,0,6.2832);bctx.fill();
}
/* particle morphs: dots flying from one shape to another */
const MORPHS=[];
function pairPts(src,dst,mode){const s=src.slice(),d=dst.slice();
  if(mode==='angle'){const a=(p,c)=>Math.atan2(p.y-c.y,p.x-c.x);const cs=cen(s),cd=cen(d);s.sort((p,q)=>a(p,cs)-a(q,cs));d.sort((p,q)=>a(p,cd)-a(q,cd));}
  else{s.sort((p,q)=>p.x-q.x);d.sort((p,q)=>p.x-q.x);}
  return s.map((p,i)=>[p,d[Math.floor(i*d.length/s.length)]]);}
function cen(a){let x=0,y=0;a.forEach(p=>{x+=p.x;y+=p.y;});return{x:x/a.length,y:y/a.length};}
function rectPts(x,y,w,h,p){const o=[];for(let yy=y+p/2;yy<y+h;yy+=p)for(let xx=x+p/2;xx<x+w;xx+=p)o.push({x:xx,y:yy});return o;}
function scatterPts(n,cx,cy,rad,seed){const R=rng(seed),o=[];for(let i=0;i<n;i++){const a=R()*6.283,r=rad*(.35+.65*Math.sqrt(R()));o.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});}return o;}
function morph(o){ /* o:{t0,dur,src,dst,pair,r0,r1,arc,stag,seed,fadeIn,fadeOut,hold,col,K} */
  const pairs=pairPts(o.src,o.dst,o.pair);const R=rng(o.seed||7);
  const n=pairs.length, A=new Float32Array(n*6);
  pairs.forEach(([p,q],i)=>{A[i*6]=p.x;A[i*6+1]=p.y;A[i*6+2]=q.x;A[i*6+3]=q.y;A[i*6+4]=R()*(o.stag||0);A[i*6+5]=(R()-.5)*2*(o.arc||0);
    if(q.red)A[i*6+5]=A[i*6+5]+0; });
  const reds=new Uint8Array(n);pairs.forEach(([p,q],i)=>reds[i]=q.red?1:0);
  const m=Object.assign({n,A,reds,K:{v:1},end:o.t0+o.dur+(o.stag||0)+(o.hold||0)},o);MORPHS.push(m);return m;}
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function drawFX(t,s,tx,ty){fctx.setTransform(DPR,0,0,DPR,0,0);fctx.clearRect(0,0,VW,VH);
  for(const m of MORPHS){if(t<m.t0||t>m.end)continue;const light=BG.m>.5;
    const col=m.col||(light?'#151515':'#E8E8E8');let fill=col;fctx.fillStyle=col;fctx.beginPath();const redPath=[];
    for(let i=0;i<m.n;i++){const a=m.A,k=i*6;let p=clamp((t-m.t0-a[k+4])/m.dur,0,1);const e=ease(p);
      const dx=a[k+2]-a[k],dy=a[k+3]-a[k+1],L=Math.hypot(dx,dy)||1;const off=Math.sin(Math.PI*e)*a[k+5];
      const x=a[k]+dx*e-dy/L*off, y=a[k+1]+dy*e+dx/L*off;
      let r=mix(m.r0,m.r1,e)*m.K.v; if(m.fadeIn)r*=clamp(p*4,0,1); if(m.fadeOut)r*=1-clamp((p-.55)/.45,0,1);
      if(r<.3)continue;const X=x*s+tx,Y=y*s+ty,Rr=r*s;
      if(m.reds[i]&&e>.5){redPath.push([X,Y,Rr]);continue;}
      fctx.moveTo(X+Rr,Y);fctx.arc(X,Y,Rr,0,6.2832);}
    fctx.fill(); if(redPath.length){fctx.fillStyle='#D71921';fctx.beginPath();redPath.forEach(([X,Y,R])=>{fctx.moveTo(X+R,Y);fctx.arc(X,Y,R,0,6.2832);});fctx.fill();}}}

/* static art: photo frame (halftone moon over hills), album art */
function halftoneArt(c,seed,sun){const g=c.getContext('2d'),w=c.width,h=c.height;g.fillStyle='#141414';g.fillRect(0,0,w,h);const p=w/40;
  for(let y=0;y<h;y+=p)for(let x=0;x<w;x+=p){const dx=(x-sun[0]*w)/w,dy=(y-sun[1]*h)/h;let v=clamp(1-Math.hypot(dx,dy)/sun[2],0,1);
    const hill=h*(.62+.08*Math.sin(x/w*5+seed)+.05*Math.sin(x/w*11+seed*2)), hill2=h*(.75+.06*Math.sin(x/w*3.3+seed*3));
    if(y>hill)v=Math.max(v,.25+.25*Math.sin(x*.05+y*.03));if(y>hill2)v=.75;
    if(v<.04)continue;g.fillStyle=y>hill2?'#3a3a3a':'#E8E8E8';g.beginPath();g.arc(x+p/2,y+p/2,v*p*.48,0,6.283);g.fill();}}

function drawSnake(t){const g=sctx,P=19.8;g.clearRect(0,0,396,396);g.fillStyle='#202020';

  const step=Math.floor(t*8); const path=k=>{const L=64,q=((k%L)+L)%L;let x,y;if(q<16){x=2+q;y=4}else if(q<26){x=18;y=4+(q-16)}else if(q<42){x=18-(q-26);y=14}else if(q<52){x=2;y=14-(q-42)}else{x=2+(q-52)*0;y=4-(q-52)*0;}return[x,clamp(y,0,19)];};
  g.fillStyle='#E8E8E8';for(let i=0;i<6;i++){const [x,y]=path(step-i);g.beginPath();g.arc(x*P+P/2,y*P+P/2,8.2,0,6.283);g.fill();}
  const [fx2,fy2]=path(step+9);g.fillStyle='#D71921';g.beginPath();g.arc(fx2*P+P/2,fy2*P+P/2,7.5,0,6.283);g.fill();}
function eqBars(g,w,h,t,cols,rows,p,r,col){g.clearRect(0,0,w,h);for(let c=0;c<cols;c++){const v=.5+.5*Math.sin(t*6.283*2*(.8+(c%5)*.13)+c*1.7)*Math.sin(t*3.1+c*.6);const n=Math.max(1,Math.round(v*rows));

  const d=[...Array(ch)].map((_,c)=>buf.getChannelData(c));let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){out.setInt16(o,clamp(d[c][i],-1,1)*32767,true);o+=2;}return new Uint8Array(out.buffer);}

/* =====================================================================================
   6. GLUE: fit, autoplay + loop, audio sync, debug panel, export hooks
   ===================================================================================== */
const fit=()=>{const k=Math.min(innerWidth/VW,innerHeight/VH);stage.style.transform=`translate(-50%,-50%) scale(${k})`;};addEventListener('resize',fit);fit();
let AC=null, MUSIC=null, SRC=null;
function audioStart(){if(!AC||!MUSIC)return;audioStop();SRC=AC.createBufferSource();SRC.buffer=MUSIC;SRC.connect(AC.destination);SRC.start(0,tl.time());}
function audioStop(){if(SRC){try{SRC.stop();}catch(e){}SRC=null;}}
const clockEl=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');let scrubbing=false;
(function frame(){const t=tl.time();render(t);clockEl.textContent=t.toFixed(2)+'s';if(!scrubbing)scrub.value=String(t/DURATION*1000);requestAnimationFrame(frame);})();
const playFrom=t=>{tl.play(t);audioStart();btn.textContent='Pause';};
const toggle=()=>{if(tl.paused()){playFrom(tl.time()>=DURATION?0:tl.time());}else{tl.pause();audioStop();btn.textContent='Play';}};
btn.onclick=toggle; $('#btn-restart').onclick=()=>playFrom(0);
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();audioStop();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}if(/^[rR]$/.test(e.key))playFrom(0);if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on');});
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>playFrom(0));
const seek=t=>{tl.pause();tl.time(t,false);if(gsap.ticker.tick)gsap.ticker.tick();render(t);};
window.OPENER={tl,DURATION,seek,ready:false,W:VW,H:VH,CUES,
  async musicWav(){const b=await renderMusic();const u=wavBytes(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}};
document.fonts.ready.then(async()=>{
  tl.time(0);render(0); window.OPENER.ready=true;
  if(Q.has('clean'))return;
  try{MUSIC=await renderMusic();AC=new AudioContext();}catch(e){console.warn(e);}
  const go=()=>{AC&&AC.resume();playFrom(0);};
  if(AC&&AC.state!=='running'){ /* autoplay with sound blocked: hold frame 0, start on first gesture */
    const once=()=>{removeEventListener('pointerdown',once);removeEventListener('keydown',once);go();};
    addEventListener('pointerdown',once);addEventListener('keydown',once);
  } else go();
});
</script>
